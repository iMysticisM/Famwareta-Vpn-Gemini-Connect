# ==============================================================================
# FamVpnGemini - Anti-DPI & Anti-Leak Nginx Reverse Proxy Template
# Protects Server IP behind Cloudflare CDN using a Secret Randomized Path
# ==============================================================================

# Place this snippet inside your domain's server { ... } block in /etc/nginx/sites-available/
# or inside Hiddify's custom web templates.

# 1. Secret Dashboard Access (Only you know this path)
location /__SECRET_PATH__/ {
    proxy_pass http://127.0.0.1:10820/app/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Anti-Buffering for Realtime Logs
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
}

# 2. Secret API Bridge
location /__SECRET_PATH__/api/ {
    proxy_pass http://127.0.0.1:10820/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# 3. Decoy for Root and All Other Paths (Active Probing / DPI Scanners see nothing!)
# Anyone scanning https://your-domain.com/ will get a 404 or a harmless default page.
location = / {
    return 404;
}
